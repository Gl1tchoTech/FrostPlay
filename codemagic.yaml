workflows:
  ios-release:
    name: FrostPlay iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/ipa
          xcodebuild \
            -project FrostPlay.xcodeproj \
            -scheme FrostPlay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA inside ZIP
        script: |
          set -euo pipefail
          app_path="build/ios/DerivedData/Build/Products/Release-iphoneos/FrostPlay.app"
          if [ ! -d "$app_path" ]; then
            echo "Unsigned FrostPlay.app was not produced"
            exit 1
          fi

          mkdir -p build/ios/ipa/Payload
          cp -R "$app_path" build/ios/ipa/Payload/FrostPlay.app
          (cd build/ios/ipa && zip -qry FrostPlay.ipa Payload)
          rm -rf build/ios/ipa/Payload

          (cd build/ios/ipa && zip -qry FrostPlay.ipa.zip FrostPlay.ipa)
          rm -f build/ios/ipa/FrostPlay.ipa
          echo "Created build/ios/ipa/FrostPlay.ipa.zip"

    artifacts:
      - build/ios/ipa/FrostPlay.ipa.zip

